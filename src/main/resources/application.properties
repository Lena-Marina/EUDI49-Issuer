spring.application.name=issuer_ips
logging.level.org.springframework.web=DEBUG

# --- Öffentliche Basis-URL des Issuers ---------------------------------------
# Quelle für credential_issuer, issuer (AS-Metadaten), iss im SD-JWT und die
# Endpoint-URLs. 10.0.2.2 = Host-Rechner aus Sicht des Android-Emulators.
issuer.base-url=http://10.0.2.2:8080

# --- FHIR-Server -------------------------------------------------------------
# Basis-URL für Patient/{id}/$summary. Umschalten z. B. per Umgebungsvariable
# ISSUER_FHIR_BASE_URL oder --issuer.fhir.base-url=...
issuer.fhir.base-url=https://hapi.fhir.org/baseR4

# --- Wallet-Client (Valera, VC-K 5.10.1) -------------------------------------
# Muss exakt mit den Werten übereinstimmen, die Valera an /authorize schickt
issuer.wallet-client.client-id=https://wallet.a-sit.at/app
issuer.wallet-client.redirect-uri=asitplus-wallet://wallet.a-sit.at/app/callback/provisioning

# --- Mock-Login -------------------------------------------
# Benutzername -> Passwort und Nutzerkennung. Klartext-Passwörter nur für Tests!
issuer.mock-users.anna.password=geheim1
issuer.mock-users.anna.user-id=user-anna
issuer.mock-users.ben.password=geheim2
issuer.mock-users.ben.user-id=user-ben

# Nutzerkennung -> Patient-ID auf hapi.fhir.org
issuer.patient-mapping.user-anna=nhanes-110387
issuer.patient-mapping.user-ben=nhanes-121623
# --- Ausgestelltes Credential ----------------------------------------------
# Gültigkeit des IPS-Credentials (exp - iat), ISO-8601-Dauer. Ohne Refresh-Token
# braucht jede Erneuerung einen vollständigen Login.
issuer.credential.validity=P30D
